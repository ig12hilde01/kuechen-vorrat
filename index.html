<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KüchenVorrat</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#1a1a2e;color:#e0e0e0}
.card{background:#16213e;border-radius:12px;padding:14px 16px;margin-bottom:8px}
input,select,textarea{width:100%;padding:12px;background:#0f0f1a;border:1px solid #333;border-radius:10px;color:#fff;font-size:1rem;outline:none}
select option{background:#16213e}
textarea{min-height:60px;resize:vertical}
.btn{padding:12px 20px;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer}
.btn-pri{background:#6c63ff;color:#fff}
.btn-red{background:#e74c3c;color:#fff}
.btn-sec{background:#333;color:#ccc}
.btn-sm{padding:8px 14px;font-size:.85rem}
.flex{display:flex;gap:8px}
.flex>*{flex:1}
.hidden{display:none!important}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login" style="position:fixed;inset:0;background:#0f0f1a;display:flex;align-items:center;justify-content:center;z-index:99999">
<div style="background:#1a1a2e;border-radius:16px;padding:28px 24px;width:90%;max-width:300px;text-align:center">
<h1 style="font-size:1.3rem;margin-bottom:4px">🍽️ KüchenVorrat</h1>
<p style="color:#888;font-size:.75rem;margin-bottom:20px">Lagerverwaltung</p>
<input id="pw" type="text" placeholder="Passwort eingeben" inputmode="text" autocomplete="off" autofocus style="text-align:center">
<div id="err" style="color:#e74c3c;font-size:.8rem;margin-top:8px;min-height:18px"></div>
<button id="loginBtn" class="btn btn-pri" style="width:100%;margin-top:10px" onclick="doLogin()">🔓 Einloggen</button>
</div>
</div>

<!-- APP -->
<div id="app" class="hidden" style="height:100vh;height:100dvh;display:flex;flex-direction:column">
<header style="display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#16213e;border-bottom:1px solid #2a2a4a;flex-shrink:0">
<span id="hdrTitle" style="font-size:1.1rem;color:#6c63ff">🍽 Vorrat</span>
<button class="btn btn-sec btn-sm" onclick="doLogout()" style="background:none;border:1px solid #333;color:#888">🔒</button>
</header>
<nav id="tabsBar" style="display:flex;background:#16213e;border-bottom:1px solid #2a2a4a;flex-shrink:0;overflow-x:auto">
<button class="tab active" data-tab="pantry" onclick="go('pantry',this)">🍽 Vorrat</button>
<button class="tab" data-tab="locations" onclick="go('locations',this)">🗄 Lager</button>
<button class="tab" data-tab="recipes" onclick="go('recipes',this)">📖 Kochbuch</button>
<button class="tab" data-tab="weekplan" onclick="go('weekplan',this)">📅 Woche</button>
<button class="tab" data-tab="shopping" onclick="go('shopping',this)">🛒 Liste</button>
<button class="tab" data-tab="settings" onclick="go('settings',this)">⚙️</button>
</nav>
<main style="flex:1;overflow-y:auto;padding:12px;padding-bottom:70px" id="mainArea"></main>
<button class="btn btn-pri" onclick="fabClick()" style="position:fixed;bottom:20px;right:20px;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;box-shadow:0 4px 15px rgba(108,99,255,.4)">+</button>
</div>

<!-- PRODUCT MODAL -->
<div id="mProd" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;z-index:100">
<div style="background:#1a1a2e;border-radius:16px 16px 0 0;width:100%;max-width:500px;margin:0 auto;padding:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom))">
<h2 id="mProdTitle" style="font-size:1rem;margin-bottom:16px">Produkt</h2>
<div style="margin-bottom:12px"><label style="font-size:.65rem;color:#888;text-transform:uppercase">Name *</label><input id="fPName" placeholder="z.B. Nudeln"></div>
<div class="flex" style="margin-bottom:12px"><div><label style="font-size:.65rem;color:#888;text-transform:uppercase">Barcode</label><input id="fPBarcode" placeholder="Optional" inputmode="numeric" style="margin-top:2px"></div><button class="btn btn-pri btn-sm" onclick="doOnlineLookup()" style="margin-top:2px;white-space:nowrap" title="Online suchen">🔍</button></div>
<div id="lookupInfo" class="hidden" style="background:#16213e;border-radius:10px;padding:12px;margin-bottom:12px"></div>
<div style="margin-bottom:12px"><label style="font-size:.65rem;color:#888;text-transform:uppercase">Kategorie</label><select id="fPCat" style="margin-top:2px"><option>Nudeln</option><option>Reis</option><option>Konserven</option><option>Gewürze</option><option>Öl</option><option>Saucen</option><option>Mehlhelfer</option><option>Süßes</option><option>Getränke</option><option>Kühlregal</option><option>Frischkost</option><option>Obst</option><option>Gemüse</option><option>Fleisch</option><option>Käse</option><option>Tiefkühler</option><option>Bier</option><option>Sonstiges</option></select></div>
<div class="flex" style="margin-bottom:12px"><div><label style="font-size:.65rem;color:#888;text-transform:uppercase">Menge *</label><input id="fPQty" type="number" placeholder="0" min="0" style="margin-top:2px"></div><div><label style="font-size:.65rem;color:#888;text-transform:uppercase">Einheit</label><select id="fPUnit" style="margin-top:2px"><option>Stk</option><option>g</option><option>kg</option><option>ml</option><option>l</option></select></div></div>
<div class="flex" style="margin-bottom:12px"><div><label style="font-size:.65rem;color:#888;text-transform:uppercase">Gebinde</label><input id="fPPkg" placeholder="z.B. 500ml" style="margin-top:2px"></div><div><label style="font-size:.65rem;color:#888;text-transform:uppercase">Verfall</label><input id="fPExp" type="date" style="margin-top:2px"></div></div>
<div style="margin-bottom:12px"><label style="font-size:.65rem;color:#888;text-transform:uppercase">Lagerplatz</label><select id="fPLoc" style="margin-top:2px"><option value="">— Ohne —</option></select></div>
<div style="margin-bottom:12px"><label style="font-size:.65rem;color:#888;text-transform:uppercase">Marke</label><input id="fPBrand" placeholder="Optional" style="margin-top:2px"></div>
<div style="margin-bottom:16px"><label style="font-size:.65rem;color:#888;text-transform:uppercase">Bemerkung</label><textarea id="fPNote" style="margin-top:2px"></textarea></div>
<div class="flex"><button class="btn btn-sec" onclick="closeM('mProd')">Abbrechen</button><button class="btn btn-pri" id="mProdSave" onclick="saveProduct()">Speichern</button></div>
</div>
</div>

<!-- LOCATION MODAL -->
<div id="mLoc" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;z-index:100">
<div style="background:#1a1a2e;border-radius:16px 16px 0 0;width:100%;max-width:500px;margin:0 auto;padding:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom))">
<h2 id="mLocTitle" style="font-size:1rem;margin-bottom:16px">Lagerplatz</h2>
<div style="margin-bottom:12px"><label style="font-size:.65rem;color:#888;text-transform:uppercase">Name *</label><input id="fLName" placeholder="z.B. Kühlschrank Türfach" style="margin-top:2px"></div>
<div style="margin-bottom:12px"><label style="font-size:.65rem;color:#888;text-transform:uppercase">Raum *</label><select id="fLCat" style="margin-top:2px"><option>Kühlschrank</option><option>Gefrierschrank</option><option>Küchenschrank</option><option>Speisekammer</option><option>Keller</option><option>Hauswirtschaft</option><option>Sonstiges</option></select></div>
<div class="flex"><button class="btn btn-sec" onclick="closeM('mLoc')">Abbrechen</button><button class="btn btn-pri" onclick="saveLocation()">Speichern</button></div>
</div>
</div>

<!-- QR CODE MODAL -->
<div id="mQr" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;z-index:100">
<div style="background:#1a1a2e;border-radius:16px 16px 0 0;width:100%;max-width:500px;margin:0 auto;padding:24px;text-align:center">
<h2 id="qrTitle" style="font-size:1rem;margin-bottom:12px">QR Code</h2>
<div id="qrContainer"></div>
<div id="qrInfo" style="color:#888;font-size:.8rem;margin:12px 0 16px"></div>
<div class="flex"><button class="btn btn-sec" onclick="closeM('mQr')">Schließen</button><button class="btn btn-pri" onclick="printQR()">🖨 Drucken</button></div>
</div>
</div>

<!-- LOCATION VIEW MODAL -->
<div id="mLocView" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;z-index:100">
<div style="background:#1a1a2e;border-radius:16px 16px 0 0;width:100%;max-width:500px;margin:0 auto;padding:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom))">
<h2 id="locViewTitle" style="font-size:1rem;margin-bottom:16px">Lagerplatz</h2>
<div id="locViewContent"></div>
<div class="flex"><button class="btn btn-sec" onclick="closeM('mLocView')">Schließen</button></div>
</div>
</div>

<!-- SCANNER FULLSCREEN -->
<div id="scannerWrap" class="hidden" style="position:fixed;inset:0;background:#000;z-index:200;display:flex;flex-direction:column">
<div id="scannerReader" style="flex:1"></div>
<div id="scanResult" class="hidden" style="padding:12px 16px;background:#16213e;text-align:center;font-size:.85rem"></div>
<div style="display:flex;gap:10px;padding:16px;background:#1a1a2e;justify-content:center">
<button class="btn btn-sec" onclick="stopScanner()">⏹ Stopp</button>
</div>
</div>

<!-- CONFIRM MODAL -->
<div id="mConfirm" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100">
<div style="background:#1a1a2e;border-radius:16px;padding:24px;width:90%;max-width:300px;text-align:center">
<h2 style="font-size:1rem;margin-bottom:8px">Bist du sicher?</h2>
<p id="confirmTxt" style="color:#888;font-size:.85rem;margin-bottom:20px"></p>
<div class="flex"><button class="btn btn-sec" onclick="closeM('mConfirm')">Abbrechen</button><button class="btn btn-red" id="confirmBtn">Löschen</button></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
var PW='kueche2024';
var DKEY='kv';
function ld(){try{return JSON.parse(localStorage.getItem(DKEY))||{products:[],locations:[],shopping:[],appliances:['herd','ofen','mikrowelle','kaffeemaschine'],weekPlan:null}}catch(e){return{products:[],locations:[],shopping:[],appliances:['herd','ofen','mikrowelle','kaffeemaschine'],weekPlan:null}}}
function sv(){localStorage.setItem(DKEY,JSON.stringify({products:d.products,locations:d.locations,shopping:d.shopping,appliances:d.appliances,weekPlan:d.weekPlan}))}
var d=ld();
var tab='pantry',cf='all',rf='all';
var scanMode='product',pendingLoc=null,qrRunning=false;

function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function uid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,6)}
function toast(m){var t=document.createElement('div');t.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a1a2e;border:1px solid #333;padding:10px 20px;border-radius:10px;font-size:.85rem;color:#fff;z-index:200;transition:opacity .3s';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.style.opacity='0';setTimeout(function(){t.remove()},300)},2000)}
function closeM(id){document.getElementById(id).classList.add('hidden');var el=document.getElementById(id);if(el)el.style.display=''}
function openM(id){var el=document.getElementById(id);el.classList.remove('hidden');el.style.display='flex'}
function showCf(txt,cb){document.getElementById('confirmTxt').textContent=txt;document.getElementById('confirmBtn').onclick=function(){closeM('mConfirm');cb()};openM('mConfirm')}
document.querySelectorAll('[id^="m"]').forEach(function(m){m.addEventListener('click',function(e){if(e.target===m)closeM(m.id)})});

// ══ LOGIN ══
function doLogin(){
  var pw=document.getElementById('pw');
  var err=document.getElementById('err');
  var btn=document.getElementById('loginBtn');
  if(pw.value===PW){
    err.textContent='';
    pw.value='';
    btn.textContent='...';
    btn.disabled=true;
    document.getElementById('login').style.display='none';
    var app=document.getElementById('app');
    app.style.display='flex';
    app.classList.remove('hidden');
    render();
  } else {
    err.textContent='Falsches Passwort';
    pw.value='';
    pw.focus();
  }
}
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();doLogin()}});
function doLogout(){location.reload()}

// ══ TABS ══
function go(t,btn){
  tab=t;
  document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('active')});
  if(btn)btn.classList.add('active');
  document.getElementById('hdrTitle').textContent={pantry:'🍽 Vorrat',locations:'🗄 Lager',recipes:'📖 Kochbuch',weekplan:'📅 Woche',shopping:'🛒 Liste',settings:'⚙️'}[t]||'Vorrat';
  render();
}

function catEmoji(c){var m={Nudeln:'🍝',Reis:'🍚',Konserven:'🥫',Gewürze:'🧂',Öl:'🫒',Saucen:'🍶',Mehlhelfer:'🌾',Süßes:'🍫',Getränke:'🥤',Kühlregal:'🧊',Frischkost:'🥗',Obst:'🍎',Gemüse:'🥕',Fleisch:'🥩',Käse:'🧀',Tiefkühler:'❄️',Bier:'🍺',Sonstiges:'📦'};return m[c]||'📦'}

function expSt(exp){
  if(!exp)return null;
  var now=Date.now(),d=Math.ceil((new Date(exp).getTime()-now)/864e5);
  if(d<0)return{l:(Math.abs(d)+'x abgelaufen'),c:'color:#e74c3c'};
  if(d<=3)return{l:(d<=0?'Heute!':'In '+d+'d'),c:'color:#f39c12'};
  return{l:exp,c:'color:#27ae60'};
}

function fabClick(){
  if(tab==='pantry'||tab==='locations')openAdd();
  else if(tab==='shopping')document.getElementById('shopInput').focus();
}

// ══ PANTRY ══
function render(){
  var main=document.getElementById('mainArea');
  if(tab==='pantry')renderPantry(main);
  else if(tab==='locations')renderLocs(main);
  else if(tab==='recipes')renderRec(main);
  else if(tab==='weekplan')renderWeek(main);
  else if(tab==='shopping')renderShop(main);
  else renderSet(main);
}

function renderPantry(main){
  var items=d.products.slice().sort(function(a,b){return(a.exp?new Date(a.exp):new Date('2999'))-(b.exp?new Date(b.exp):new Date('2999'))});
  var cats=[...new Set(items.map(function(p){return p.cat}))].sort();
  var search=document.getElementById('searchInput').value.toLowerCase();
  if(search)items=items.filter(function(p){return(p.name||'').toLowerCase().indexOf(search)>=0||(p.cat||'').toLowerCase().indexOf(search)>=0});
  if(cf!=='all')items=items.filter(function(p){return p.cat===cf});
  var total=d.products.length,exp=0,soon=0;
  items.forEach(function(p){if(p.exp){var d2=Math.ceil((new Date(p.exp).getTime()-Date.now())/864e5);if(d2<0)exp++;else if(d2<=7)soon++}});

  var h='<div style="display:flex;gap:8px;margin-bottom:12px"><div class="card" style="flex:1;text-align:center"><div style="font-size:1.2rem;font-weight:700;color:#6c63ff">'+total+'</div><div style="font-size:.65rem;color:#888">Produkte</div></div><div class="card" style="flex:1;text-align:center"><div style="font-size:1.2rem;font-weight:700;color:#f39c12">'+soon+'</div><div style="font-size:.65rem;color:#888">Bald abgelaufen</div></div><div class="card" style="flex:1;text-align:center"><div style="font-size:1.2rem;font-weight:700;color:#e74c3c">'+exp+'</div><div style="font-size:.65rem;color:#888">Abgelaufen</div></div></div>';
  h+='<div class="flex" style="margin-bottom:12px"><input type="text" id="searchInput" placeholder="Suchen..." oninput="render()" style="margin-top:0"><button class="btn btn-sec btn-sm" onclick="scanProd()" style="margin-top:0;white-space:nowrap" title="Barcode">📷</button><button class="btn btn-sec btn-sm" onclick="scanLoc()" style="margin-top:0;white-space:nowrap" title="Lager-Code">🏷</button></div>';

  var pills='<div class="flex" style="margin-bottom:12px;overflow-x:auto;padding-bottom:8px">';
  pills+='<div onclick="filterCat(\'all\',this)" class="pill '+(cf==='all'?'on':'')+'" style="flex-shrink:0;padding:6px 14px;border-radius:20px;background:'+((cf==='all')?'#6c63ff':'#16213e')+';color:'+((cf==='all')?'#fff':'#888')+';font-size:.78rem;border:1px solid #333;cursor:pointer;white-space:nowrap">Alle ('+total+')</div>';
  cats.forEach(function(c){
    var cnt=d.products.filter(function(p){return p.cat===c}).length;
    pills+='<div onclick="filterCat(\''+c+'\',this)" class="pill '+((cf===c)?'on':'')+'" style="flex-shrink:0;padding:6px 14px;border-radius:20px;background:'+((cf===c)?'#6c63ff':'#16213e')+';color:'+((cf===c)?'#fff':'#888')+';font-size:.78rem;border:1px solid #333;cursor:pointer;white-space:nowrap">'+esc(c)+' ('+cnt+')</div>';
  });
  pills+='</div>';
  h+=pills;

  if(!items.length){h+='<div style="text-align:center;padding:40px 20px"><div style="font-size:2.5rem;margin-bottom:8px">🍽️</div><p style="color:#555;font-size:.85rem">Noch keine Produkte.<br>Tippe + zum Hinzufügen.</p></div>'}
  else{
    h+=items.map(function(p){
      var loc=d.locations.find(function(l){return l.id===p.locId});
      var ex=expSt(p.exp);
      var exHtml=ex?'<span style="font-size:.7rem;color:'+ex.c+'">'+ex.l+'</span>':'';
      var locHtml=loc?'<span style="font-size:.7rem;color:#6c63ff">📍 '+esc(loc.name)+'</span>':'';
      return '<div class="card" onclick="editProd(\''+p.id+'\')"><div class="flex" style="align-items:flex-start"><div style="font-size:1.4rem;flex-shrink:0;margin-right:10px">'+catEmoji(p.cat)+'</div><div style="flex:1"><div style="font-weight:600">'+esc(p.name)+'</div><div style="font-size:.75rem;color:#888">'+p.qty+' '+esc(p.unit)+(p.pkg?' · '+esc(p.pkg):'')+(locHtml?'<br>'+locHtml:'')+'</div><div style="margin-top:3px">'+exHtml+'</div></div><div class="flex" style="gap:4px"><button onclick="event.stopPropagation();editProd(\''+p.id+'\')" style="background:none;border:1px solid #333;color:#888;width:32px;height:32px;border-radius:8px;font-size:.8rem;cursor:pointer">✏️</button><button onclick="event.stopPropagation();delProd(\''+p.id+'\')" style="background:none;border:1px solid #333;color:#e74c3c;width:32px;height:32px;border-radius:8px;font-size:.8rem;cursor:pointer">🗑</button></div></div></div>';
    }).join('');
  }
  main.innerHTML=h;
}

function filterCat(f,el){cf=f;document.querySelectorAll('.flex > div[onclick*=filterCat]').forEach(function(d){d.style.background='#16213e';d.style.color='#888'});el.style.background='#6c63ff';el.style.color='#fff';render()}

// ══ PRODUCT CRUD ══
function openAdd(editId,prefLoc){
  document.getElementById('mProdTitle').textContent=editId?'Produkt bearbeiten':'Produkt hinzufügen';
  document.getElementById('lookupInfo').classList.add('hidden');
  var locs=d.locations.sort(function(a,b){return a.name.localeCompare(b.name)});
  var opts='<option value="">— Ohne —</option>';
  locs.forEach(function(l){opts+='<option value="'+l.id+'">'+esc(l.name)+'</option>'});
  document.getElementById('fPLoc').innerHTML=opts;
  if(editId){
    var p=d.products.find(function(x){return x.id===editId});if(!p)return;
    document.getElementById('fPName').value=p.name;document.getElementById('fPBarcode').value=p.barcode||'';
    document.getElementById('fPCat').value=p.cat||'Sonstiges';document.getElementById('fPQty').value=p.qty;
    document.getElementById('fPUnit').value=p.unit||'g';document.getElementById('fPPkg').value=p.pkg||'';
    document.getElementById('fPExp').value=p.exp||'';document.getElementById('fPLoc').value=p.locId||'';
    document.getElementById('fPBrand').value=p.brand||'';document.getElementById('fPNote').value=p.note||'';
    document.getElementById('mProdSave').onclick=function(){saveProd(editId)};
  } else {
    ['fPName','fPBarcode','fPQty','fPPkg','fPBrand','fPNote'].forEach(function(id){document.getElementById(id).value=''});
    document.getElementById('fPExp').value='';document.getElementById('fPLoc').selectedIndex=0;
    document.getElementById('mProdSave').onclick=function(){saveProd(null)};
  }
  if(prefLoc)document.getElementById('fPLoc').value=prefLoc;
  openM('mProd');setTimeout(function(){document.getElementById('fPName').focus()},150);
}
function editProd(id){openAdd(id)}
function saveProd(editId){
  var nm=document.getElementById('fPName').value.trim();if(!nm){toast('Name fehlt!');return}
  var obj={name:nm,barcode:document.getElementById('fPBarcode').value.trim(),cat:document.getElementById('fPCat').value,
    qty:parseInt(document.getElementById('fPQty').value)||0,unit:document.getElementById('fPUnit').value,
    pkg:document.getElementById('fPPkg').value.trim(),exp:document.getElementById('fPExp').value,
    locId:document.getElementById('fPLoc').value||null,brand:document.getElementById('fPBrand').value.trim(),
    note:document.getElementById('fPNote').value.trim()};
  if(editId){var p=d.products.find(function(x){return x.id===editId});if(!p)return;Object.assign(p,obj);toast('✅ Aktualisiert')}
  else{d.products.push({id:uid(),...obj});toast('✅ Gespeichert')}
  sv();closeM('mProd');render();
}
function delProd(id){
  var p=d.products.find(function(x){return x.id===id});if(!p)return;
  showCf('"'+p.name+'" löschen?',function(){d.products=d.products.filter(function(x){return x.id!==id});sv();render();toast('🗍 Gelöscht')});
}

// ══ ONLINE LOOKUP ══
function doOnlineLookup(){
  var code=document.getElementById('fPBarcode').value.trim();
  if(!code){toast('Barcode eingeben!');return}
  var btn=document.getElementById('mProd').querySelector('[onclick*=doOnline]');
  btn.textContent='⏳';btn.disabled=true;
  lookup(code).then(function(r){
    if(r){
      document.getElementById('lookupInfo').classList.remove('hidden');
      document.getElementById('lookupInfo').innerHTML='<div style="font-weight:600">✅ '+esc(r.name)+(r.brand?' · '+esc(r.brand):'')+'</div><div style="color:#888;font-size:.75rem">'+(r.pkg?'📦 '+esc(r.pkg)+' · ':r.cat?'📁 '+esc(r.cat)+':':'')+(r.abv?'🍺 '+r.abv:'')+(r.ibu?'🌿 IBU:'+r.ibu:'')+(r.origin?'🌍 '+r.origin:r.note||'')+'</div>';
      if(!document.getElementById('fPName').value)document.getElementById('fPName').value=r.name;
      if(!document.getElementById('fPBrand').value&&r.brand)document.getElementById('fPBrand').value=r.brand;
      if(!document.getElementById('fPPkg').value&&r.pkg)document.getElementById('fPPkg').value=r.pkg;
      if(!document.getElementById('fPNote').value&&r.note)document.getElementById('fPNote').value=r.note;
      if(r.origin)document.getElementById('fPNote').value=(document.getElementById('fPNote').value?document.getElementById('fPNote').value+'\n':'')+'Herkunft: '+r.origin;
      toast('✅ Produkt gefunden!');
    } else {
      document.getElementById('lookupInfo').classList.remove('hidden');
      document.getElementById('lookupInfo').innerHTML='<div style="color:#e74c3c">❌ Nicht gefunden</div>';
      toast('Nicht in Online-DBs');
    }
  }).catch(function(e){toast('❌ '+e.message)});
  btn.textContent='🔍';btn.disabled=false;
}

function lookup(code){
  return fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json',{signal:AbortSignal.timeout(5000)}).then(function(r){return r.json()}).then(function(j){
    if(j.status===1&&j.product){
      var p=j.product;
      var cat=mapCat(p.categories_tags||[]);
      var pkg=extPkg(p.quantity||'');
      return{name:p.product_name||p.product_name_de||'',brand:p.brands||'',cat:cat,pkg:pkg,unit:extUnit(p.quantity||''),origin:p.countries||'',barcode:code,note:'OpenFoodFacts'};
    }
    return null;
  }).catch(function(){
    return fetch('https://api.openbrewerydb.org/v1/beers?barcode='+code,{signal:AbortSignal.timeout(5000)}).then(function(r){return r.json()}).then(function(j){
      if(j&&j.length){
        var b=j[0];
        return{name:b.name||'Unbekannt',brand:b.brand_name||b.brewery_name||'',cat:'Bier',pkg:b.volume_label||'',unit:extUnit(b.volume_label||''),abv:b.abv?b.abv.toFixed(1)+'%':'',ibu:b.ibu||'',barcode:code,note:'OpenBreweryDB'};
      }
      return null;
    }).catch(function(){return null});
  });
}
function mapCat(tags){var t=(tags||[]).join(',').toLowerCase();if(/noodle|pasta/.test(t))return'Nudeln';if(/rice/.test(t))return'Reis';if(/canned/.test(t))return'Konserven';if(/oil/.test(t))return'Öl';if(/sauce/.test(t))return'Saucen';if(/flour|grain/.test(t))return'Mehlhelfer';if(/sweet|chocolate/.test(t))return'Süßes';if(/drink|juice/.test(t))return'Getränke';if(/dairy/.test(t))return'Kühlregal';if(/fruit/.test(t))return'Obst';if(/vegetable/.test(t))return'Gemüse';if(/meat/.test(t))return'Fleisch';if(/cheese/.test(t))return'Käse';return'Sonstiges'}
function extPkg(q){if(!q)return'';var m=q.match(/^(\d+)[\.,\s]*(g|kg|ml|l|cl)?$/i);return m?(m[1].replace(',','.')+(m[2]?m[2].toLowerCase():'')):q}
function extUnit(q){if(!q)return'';if(q.indexOf('l')>=0&&q.indexOf('ml')<0)return'l';if(q.indexOf('ml')>=0)return'ml';if(q.indexOf('kg')>=0)return'kg';if(q.indexOf('g')>=0)return'g';return''}

function scanLoc(){

  catch(e){toast('❌ Kamera nicht verfügbar');stopScan()}

function onScan(text){
  scannerOn=false;stopScan();
  if(pendingLoc){assignToLoc(text);return}
  if(scanMode==='location'){
    var loc=d.locations.find(function(l){return l.code===text.toUpperCase()});
    if(loc){
      var sr=document.getElementById('scanResult');sr.textContent='📍 '+loc.name;
      viewLoc(loc);
    } else {
      var sr=document.getElementById('scanResult');sr.textContent='❌ Kein Code: '+text;
      toast('Lagerplatz nicht gefunden');
    }
  } else {
    document.getElementById('scanResult').classList.remove('hidden');
    document.getElementById('scanResult').textContent='📷 Barcode: '+text;
    handleScan(text);
  }
}

function handleScan(code){
  var local=d.products.find(function(p){return p.barcode===code});
  if(local){
    if(confirm('"'+local.name+'" bereits vorhanden. Menge +1?\nAktuell: '+local.qty+' '+local.unit)){
      local.qty+=1;sv();render();toast('✅ '+local.name+' +1');
    }
    return;
  }
  lookup(code).then(function(online){
    if(online){
      document.getElementById('fPBarcode').value=code;
      document.getElementById('fPName').value=online.name;
      if(online.brand)document.getElementById('fPBrand').value=online.brand;
      if(online.pkg)document.getElementById('fPPkg').value=online.pkg;
      document.getElementById('fPCat').value=online.cat||'Sonstiges';
      openAdd(null,null);toast('✅ Daten aus Online-DB');
    } else {
      document.getElementById('fPBarcode').value=code;
      openAdd(null,null);toast('📝 Manuell ausfüllen');
    }
  });
}

function assignToLoc(code){
  var local=d.products.find(function(p){return p.barcode===code});
  if(local){
    local.locId=pendingLoc;sv();render();
    var loc=d.locations.find(function(l){return l.id===pendingLoc});
    toast('✅ '+local.name+' → '+loc.name);
  } else {
    var pl=pendingLoc;
    document.getElementById('fPBarcode').value=code;
    document.getElementById('mProdSave').onclick=function(){
      var nm=document.getElementById('fPName').value.trim();if(!nm){toast('Name fehlt!');return}
      d.products.push({id:uid(),name:nm,barcode:code,cat:document.getElementById('fPCat').value,qty:parseInt(document.getElementById('fPQty').value)||1,unit:document.getElementById('fPUnit').value,pkg:document.getElementById('fPPkg').value.trim(),exp:document.getElementById('fPExp').value,locId:pl,brand:document.getElementById('fPBrand').value.trim(),note:'Barcode-Sync'+(document.getElementById('fPNote').value?' · '+document.getElementById('fPNote').value:'')});

function genWeek(){
  var avail=new Set(d.products.map(function(p){return p.name.toLowerCase()}));
  var scored=RECIPES.map(function(r){var s=0;r.i.forEach(function(i){if(Array.from(avail).some(function(a){return a.indexOf(i.toLowerCase())>=0}))s++});return Object.assign({},r,{sc:s})}).sort(function(a,b){return b.sc-a.sc});
  var days=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
  var types=['Frühstück','Mittagessen','Abendessen'];
  var wp=[];
  for(var di=0;di<7;di++){
    var meals=types.map(function(type,ti){var m=scored.filter(function(r){return r.ty===type});return m.length?m[(di+ti)%m.length]:scored[di%scored.length]||null}).filter(Boolean);
    wp.push({day:days[di],recipes:meals});
  }
  d.weekPlan=wp;sv();render();toast('✨ Wochenplan!');
}

    d.shopping.forEach(function(item,i){
      var inInv=d.products.some(function(p){return p.name.toLowerCase()===item.name.toLowerCase()});
      sh+='<div class="card" style="'+(inInv?'opacity:.6;':'')+'display:flex;align-items:center;gap:10px;padding:12px 14px"><input type="checkbox" '+((inInv?'disabled checked':''))+' style="width:20px;height:20px;accent-color:#6c63ff"><div style="flex:1"><div style="font-weight:600;font-size:.9rem">'+esc(item.name)+'</div><div style="font-size:.75rem;color:#888">'+item.qty+' '+esc(item.unit||'')+'</div></div>'+(inInv?'<button onclick="moveInv('+i+')" style="background:#6c63ff;color:#fff;border:none;padding:6px 10px;border-radius:6px;font-size:.75rem;cursor:pointer">✓</button>':'')+'<button onclick="delShop('+i+')" style="background:none;border:none;color:#e74c3c;font-size:1rem;cursor:pointer">✕</button></div>';
    });
  }
  main.innerHTML=sh;
}

function addShop(){
  var nm=document.getElementById('shopInput').value.trim();if(!nm)return;
  var qty=parseInt(document.getElementById('shopQty').value)||1;
  d.shopping.push({id:uid(),name:nm,qty:qty,unit:'Stk',cat:'Sonstiges'});
  document.getElementById('shopInput').value='';sv();render();toast('✅ '+nm);
}
function addSugg(n,u,c){if(d.shopping.some(function(s){return s.name.toLowerCase()===n.toLowerCase()})){toast('⚠️ Schon da');return}d.shopping.push({id:uid(),name:n,qty:1,unit:u,cat:c});sv();render();toast('✅')}
function delShop(i){d.shopping.splice(i,1);sv();render()}
function clearShop(){showCf('Liste leeren?',function(){d.shopping=[];sv();render();toast('🗍')})}
function moveInv(i){
  var item=d.shopping[i];if(!item)return;
  var ex=d.products.find(function(p){return p.name.toLowerCase()===item.name.toLowerCase()});
  if(ex){ex.qty+=item.qty;toast('✅ '+item.name)}
  else{d.products.push({id:uid(),name:item.name,barcode:'',cat:item.cat||'Sonstiges',qty:item.qty,unit:item.unit,pkg:'',exp:'',locId:null,note:''});toast('✅ '+item.name+' angelegt')}
  d.shopping.splice(i,1);sv();render();
}

// ══ SETTINGS ══
function renderSet(main){
  main.innerHTML='<div style="font-size:.7rem;color:#888;text-transform:uppercase;margin:8px 0 8px">📤 Backup herunterladen</div>'+
    '<button onclick="exportData()" class="btn btn-pri" style="width:100%;padding:14px;margin-bottom:16px">📥 JSON herunterladen</button>'+
    '<div style="font-size:.7rem;color:#888;text-transform:uppercase;margin:8px 0 8px">📥 Backup importieren</div>'+
    '<input type="file" accept=".json" onchange="importData(event)" style="margin-bottom:16px">'+
    '<div style="font-size:.7rem;color:#888;text-transform:uppercase;margin:8px 0 8px">🗑️ Alles löschen</div>'+
    '<button onclick="clearAll()" class="btn btn-red" style="width:100%;padding:14px">Unwiderruflich löschen</button>';
}

function exportData(){
  var b=new Blob([JSON.stringify({products:d.products,locations:d.locations,shopping:d.shopping,appliances:d.appliances,weekPlan:d.weekPlan,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});
  var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download='kuechen-vorrat-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(u);toast('📤 Exportiert!');
}
function importData(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(ev){try{var j=JSON.parse(ev.target.result);if(j.products)d.products=j.products;if(j.locations)d.locations=j.locations;if(j.shopping)d.shopping=j.shopping;if(j.weekPlan)d.weekPlan=j.weekPlan;sv();render();toast('📥 Importiert! '+d.products.length+' Produkte')}catch(err){toast('❌ '+err.message)}};
  r.readAsText(f);e.target.value='';
}
function clearAll(){showCf('Alles unwiderruflich löschen?',function(){d=ld();sv();render();toast('🗍')})}

// ══ INIT ══
</script>
</body>
</html>
