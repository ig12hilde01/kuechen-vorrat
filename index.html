<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>KüchenVorrat DB v18</title>
<style>
:root{--bg:#0f0f1a;--card:#1a1a2e;--pri:#6c63ff;--txt:#e0e0e0;--sub:#888;--red:#e74c3c;--green:#27ae60;--amber:#f39c12}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;min-height:100dvh}
.card{background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:8px}
input,select,textarea{width:100%;padding:11px;background:var(--bg);border:1px solid #333;border-radius:10px;color:#fff;font-size:.95rem;outline:none;-webkit-appearance:none}
select option{background:var(--card)}textarea{min-height:60px;resize:vertical}
.flex{display:flex;gap:8px}.flex>*{flex:1}
.hidden{display:none!important}
.btn{padding:11px 16px;border:none;border-radius:10px;font-size:.9rem;font-weight:600;cursor:pointer;-webkit-appearance:none}
.btn-p{background:var(--pri);color:#fff}.btn-r{background:var(--red);color:#fff}
.btn-s{background:#333;color:#ccc}.btn-sm{padding:7px 12px;font-size:.8rem}
.badge{display:inline-block;font-size:.7rem;padding:2px 7px;border-radius:6px;font-weight:600}
.b-exp{background:rgba(231,76,60,.2);color:var(--red)}.b-soon{background:rgba(243,156,18,.2);color:var(--amber)}
.b-ok{background:rgba(39,174,96,.2);color:var(--green)}.b-loc{background:rgba(108,99,255,.15);color:var(--pri)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:100;align-items:flex-end}
.modal.on{display:flex}
.modal-body{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:500px;margin:0 auto;padding:24px;padding-bottom:calc(24px+env(safe-area-inset-bottom))}
.modal-body h2{font-size:.95rem;margin-bottom:14px}
.fg{margin-bottom:12px}.fg label{display:block;font-size:.65rem;color:var(--sub);text-transform:uppercase;margin-bottom:4px}
.mbtns{display:flex;gap:8px;margin-top:16px}.mbtns button{flex:1}
.empty{text-align:center;padding:50px 20px}.empty .ic{font-size:2.5rem;margin-bottom:8px}.empty p{color:#555;font-size:.85rem}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.pill{flex-shrink:0;padding:5px 12px;border-radius:18px;background:var(--card);color:var(--sub);font-size:.75rem;border:1px solid #333;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tab{flex-shrink:0;padding:10px 12px;text-align:center;font-size:.75rem;font-weight:600;color:var(--sub);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--pri);border-bottom-color:var(--pri)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid #333;padding:10px 20px;border-radius:10px;font-size:.85rem;z-index:200;pointer-events:none;animation:toastIn .3s}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.time-line{position:relative;padding-left:16px}
.time-line::before{content:'';position:absolute;left:5px;top:0;bottom:0;width:2px;background:#333}
.tl-item{position:relative;padding:6px 0}.tl-item::before{content:'';position:absolute;left:-16px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--pri);border:2px solid var(--card)}
.tl-item.used::before{background:var(--green)}
.tl-item.bought::before{background:var(--amber)}
.tl-item.expired::before{background:var(--red)}
.tl-item.created::before{background:#3498db}
.scanner-overlay{position:fixed;inset:0;background:#000;z-index:9999;display:none;flex-direction:column;-webkit-overflow-scrolling:touch}
.scanner-overlay.on{display:flex}
#scanReader{flex:1;position:relative}
#scanReader video{width:100%;height:100%;object-fit:cover;display:block}
.scan-reticle{position:absolute;top:50%;left:50%;width:250px;height:250px;transform:translate(-50%,-50%);border:3px solid rgba(108,99,255,.8);border-radius:8px;pointer-events:none;box-shadow:0 0 0 9999px rgba(0,0,0,.35)}
.scan-reticle::after{content:'Barcode hier ausrichten';display:block;text-align:center;font-size:.65rem;color:rgba(255,255,255,.6);margin-top:8px;padding-top:8px;border-top:1px solid rgba(108,99,255,.4)}
.scan-bar{display:flex;gap:10px;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));background:#1a1a2e;justify-content:center;flex-shrink:0}
.scan-bar button{background:#333;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:.9rem;cursor:pointer;-webkit-appearance:none;font-weight:600}
.scan-bar button.scan-btn-toggle{background:#6c63ff;color:#fff}
.scan-bar button.scan-btn-cancel{background:var(--red);color:#fff}
.qr-wrap{text-align:center;padding:16px}.qr-wrap canvas{border:3px solid var(--card);border-radius:8px}
</style>
</head>
<body>
<div id="login" style="position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:99999">
<div class="card" style="max-width:300px;text-align:center">
<h1 style="margin-bottom:4px">🍽️ KüchenVorrat DB</h1>
<p style="color:var(--sub);font-size:.7rem;margin-bottom:20px">IndexDB Datenbank</p>

</div>

<header style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:#16213e;border-bottom:1px solid #2a2a4a;flex-shrink:0">
<span id="hdrTitle" style="font-size:1rem;color:var(--pri)">🍽 Vorrat</span>
<button class="btn btn-sm" onclick="doLogout()" style="background:none;border:1px solid #333;color:var(--sub)">🔒</button>
</header>
<nav id="tabsBar" style="display:flex;background:#16213e;border-bottom:1px solid #2a2a4a;flex-shrink:0;overflow-x:auto">
<button class="tab on" data-tab="pantry" onclick="go('pantry',this)">🍽 Vorrat</button>
<button class="tab" data-tab="locations" onclick="go('locations',this)">🗄 Lager</button>
<button class="tab" data-tab="recipes" onclick="go('recipes',this)">📖 Rezepte</button>
<button class="tab" data-tab="weekplan" onclick="go('weekplan',this)">📅 Woche</button>
<button class="tab" data-tab="shopping" onclick="go('shopping',this)">🛒 Liste</button>
<button class="tab" data-tab="settings" onclick="go('settings',this)">⚙️</button>
</nav>
<main id="mainArea" style="flex:1;overflow-y:auto;padding:10px;padding-bottom:70px"></main>
<button class="btn btn-p" onclick="fabClick()" style="position:fixed;bottom:16px;right:16px;width:48px;height:48px;border-radius:50%;font-size:1.3rem;box-shadow:0 4px 15px rgba(108,99,255,.4)">+</button>
</div>

<div id="mProd" class="modal"><div class="modal-body">
<h2 id="mProdTitle">Produkt</h2>
<div class="fg"><label>Name *</label><input id="fPName" placeholder="z.B. Nudeln"></div>
<div class="fg"><label>Barcode</label><div class="flex"><input id="fPBarcode" placeholder="Optional" inputmode="numeric"><button class="btn btn-sm btn-p" onclick="scanFromModal()" style="margin-top:0;white-space:nowrap" title="Barcode scannen">📷 Scannen</button></div></div>
<div id="lookupInfo" class="hidden" style="background:#16213e;border-radius:10px;padding:10px;margin-bottom:12px;font-size:.8rem"></div>
<div class="fg"><label>Kategorie</label><select id="fPCat"></select></div>
<div class="flex"><div class="fg"><label>Menge *</label><input id="fPQty" type="number" placeholder="0" min="0"></div><div class="fg"><label>Einheit</label><select id="fPUnit"><option>Stk</option><option>g</option><option>kg</option><option>ml</option><option>l</option></select></div></div>
<div class="flex"><div class="fg"><label>Gebinde</label><input id="fPPkg" placeholder="z.B. 500ml"></div><div class="fg"><label>Verfall</label><input id="fPExp" type="date"></div></div>
<div class="fg"><label>Lagerplatz</label><select id="fPLoc"><option value="">— Ohne —</option></select></div>
<div class="fg" id="autoCatDiv" style="background:#16213e;border-radius:10px;padding:8px 12px;margin-bottom:12px;display:none"><div style="font-size:.7rem;color:var(--amber);margin-bottom:4px">🤖 Automatisch erkannt:</div><div style="font-size:.85rem" id="autoCatText"></div><button class="btn btn-sm btn-s" onclick="document.getElementById('autoCatDiv').style.display='none'" style="margin-top:4px">Manuell ändern</button></div>

<div id="mRoom" class="modal"><div class="modal-body">
<h2>Raum</h2>

<div class="fg"><label>Typ</label><select id="fRoomType"><option>Kühlschrank</option><option>Gefrierschrank</option><option>Schrank</option><option>Speisekammer</option><option>Keller</option><option>Hauswirtschaft</option><option>Sonstiges</option></select></div>

<div id="mLoc" class="modal"><div class="modal-body">

<div class="fg"><label>Raum</label><select id="fLocRoom"></select></div>
<div class="fg"><label>Regal</label><input id="fLocShelf" placeholder="A, B, C"></div>
<div class="fg"><label>Fach</label><input id="fLocComp" placeholder="1, 2, 3"></div>
<div class="mbtns"><button class="btn btn-s" onclick="closeM('mLoc')">Abbrechen</button><button class="btn btn-p" onclick="saveLoc()">Speichern</button></div>
</div></div>

<div id="mQr" class="modal"><div class="modal-body">
<h2 id="qrTitle">QR Code</h2>
<div class="qr-wrap"><div id="qrContainer"></div></div>
<div id="qrInfo" style="color:var(--sub);font-size:.8rem;text-align:center;margin:12px 0"></div>
<div class="mbtns"><button class="btn btn-s" onclick="closeM('mQr')">Schließen</button><button class="btn btn-p" onclick="printQR()">🖨 Drucken</button></div>
</div></div>

<div id="mLocView" class="modal"><div class="modal-body">
<h2 id="locViewTitle">Lagerplatz</h2><div id="locViewContent"></div>
<div class="mbtns"><button class="btn btn-s" onclick="closeM('mLocView')">Schließen</button></div>
</div></div>

<div id="mRecipe" class="modal"><div class="modal-body">
<h2 id="mRecipeTitle">Rezept</h2>
<div class="fg"><label>Name *</label><input id="fRName" placeholder="z.B. Spaghetti Bolognese"></div>
<div class="fg"><label>Quelle (URL)</label><input id="fRUrl" placeholder="chefkoch.de/..."></div>
<div class="flex"><div class="fg"><label>Zeit</label><input id="fRTime" placeholder="30 Min"></div><div class="fg"><label>Schwierigkeit</label><select id="fRDiff"><option>Einfach</option><option>Mittel</option><option>Schwer</option></select></div></div>

</div></div>

<div id="mRImport" class="modal"><div class="modal-body">
<h2>📥 Rezept importieren</h2>
<div class="fg"><label>URL</label><input id="fRImportUrl" placeholder="https://www.chefkoch.de/rezepte/..."></div>

<div class="mbtns" style="margin-top:12px"><button class="btn btn-s" onclick="closeM('mRImport')">Abbrechen</button><button class="btn btn-p hidden" id="rImportSave" onclick="saveImportedRecipe()">✅ Importieren</button></div>
</div></div>

<div id="mConfirm" class="modal" style="align-items:center"><div class="card" style="max-width:300px;text-align:center">
<h2 style="font-size:.9rem">Bist du sicher?</h2>
<p id="confirmTxt" style="color:var(--sub);font-size:.8rem;margin:10px 0 16px"></p>
<div class="mbtns"><button class="btn btn-s" onclick="closeM('mConfirm')">Abbrechen</button><button class="btn btn-r" id="confirmBtn">Löschen</button></div>
</div></div>

<div id="timelineModal" class="modal"><div class="modal-body">
<h2 id="tlTitle">Timeline</h2>
<div class="flex" style="margin-bottom:12px">
<button class="btn btn-sm btn-p" onclick="addTimelineEntry('used')">🍽 Verbraucht</button>
<button class="btn btn-sm btn-p" onclick="addTimelineEntry('bought')">🛒 Gekauft</button>
<button class="btn btn-sm btn-p" onclick="addTimelineEntry('expedited')">⏩ Vorverlegt</button>
<button class="btn btn-sm btn-r" onclick="addTimelineEntry('expired')">🗑 Abgelaufen</button>

<div id="timelineContent"></div>
<div class="mbtns"><button class="btn btn-s" onclick="closeM('timelineModal')">Schließen</button></div>
</div></div>

<div class="scanner-overlay" id="scanWrap">
  <div id="scanReader">
    <div id="scanReticle" class="scan-reticle"></div>
  </div>
  <div class="scan-bar">
    <button id="scanBtn" class="scan-btn-toggle" onclick="toggleCamera()" style="display:none">⚡ Umschalten</button>
    <button class="scan-btn-cancel" onclick="cancelScan()">✖ Abbrechen</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
/* v17.1 - force rebuild */
/* ═══ DATABASE: IndexedDB (8 Tabellen) ═══ */
var DB_NAME='kuechen_vorrat_db',DB_VER=1,DB;

function openDB(){return new Promise(function(res,rej){
  var req=indexedDB.open(DB_NAME,DB_VER);
  req.onupgradeneeded=function(e){
    var db=e.target.result;
    if(!db.objectStoreNames.contains('categories'))db.createObjectStore('categories',{keyPath:'id'});
    if(!db.objectStoreNames.contains('rooms'))db.createObjectStore('rooms',{keyPath:'id'});
    if(!db.objectStoreNames.contains('locations'))db.createObjectStore('locations',{keyPath:'id'});
    if(!db.objectStoreNames.contains('products'))db.createObjectStore('products',{keyPath:'id'});
    if(!db.objectStoreNames.contains('recipe_ingredients'))db.createObjectStore('recipe_ingredients',{keyPath:'id'});
    if(!db.objectStoreNames.contains('shopping'))db.createObjectStore('shopping',{keyPath:'id'});
    if(!db.objectStoreNames.contains('weekly_meals'))db.createObjectStore('weekly_meals',{keyPath:'id'});
    if(!db.objectStoreNames.contains('weekly_plans'))db.createObjectStore('weekly_plans',{keyPath:'id'});
    if(!db.objectStoreNames.contains('product_timeline'))db.createObjectStore('product_timeline',{keyPath:'id'});
  };
  req.onsuccess=function(e){DB=e.target.result;res(DB)};
  req.onerror=function(e){rej(e)};
});}

function dbPut(store,obj){return new Promise(function(res,rej){var t=DB.transaction(store,'readwrite');var s=t.objectStore(store);var r=s.put(obj);r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function dbGet(store,key){return new Promise(function(res,rej){var t=DB.transaction(store,'readonly');var s=t.objectStore(store);var r=s.get(key);r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function dbGetAll(store){return new Promise(function(res,rej){var t=DB.transaction(store,'readonly');var s=t.objectStore(store);var r=s.getAll();r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function dbDel(store,key){return new Promise(function(res,rej){var t=DB.transaction(store,'readwrite');var s=t.objectStore(store);var r=s.delete(key);r.onsuccess=function(){res()};r.onerror=function(){rej(r.error)}})}
function dbClear(store){return new Promise(function(res,rej){var t=DB.transaction(store,'readwrite');var s=t.objectStore(store);var r=s.clear();r.onsuccess=function(){res()};r.onerror=function(){rej(r.error)}})}

/* ═══ STATE ═══ */
var PW='kueche2024',TAB='pantry',CF='all',RF='all';
var scanMode='product',pendingLoc=null,importedRecipe=null,curTimelineProd=null;
var cats=[],rooms=[],locs=[],products=[],recipes=[],shopping=[];
var _auth=false;

function uid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,7)}
function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.style.opacity='0';setTimeout(function(){t.remove()},300)},2000)}
function closeM(id){var el=document.getElementById(id);el.classList.remove('on');el.style.display='none'}
function openM(id){var el=document.getElementById(id);el.classList.add('on');el.style.display='flex'}
function showCf(txt,cb){document.getElementById('confirmTxt').textContent=txt;document.getElementById('confirmBtn').onclick=function(){closeM('mConfirm');cb()};openM('mConfirm')}
document.querySelectorAll('.modal').forEach(function(m){m.addEventListener('click',function(e){if(e.target===m)closeM(m.id)})});
function today(){return new Date().toISOString().slice(0,10)}
function timeStr(ts){if(!ts)return'';var d=new Date(ts);return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}

/* ═══ LOGIN ═══ */
function doLogin(){
  var pw=document.getElementById('pw'),err=document.getElementById('err'),btn=document.getElementById('loginBtn');
  if(pw.value===PW){
    err.textContent='';pw.value='';btn.textContent='...';btn.disabled=true;
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='flex';
    document.getElementById('app').classList.remove('hidden');
    try{initApp()}catch(e){console.error('Login init failed:',e);toast('DB-Fehler, versuche neu...');render()}
  } else {err.textContent='Falsches Passwort';pw.value='';pw.focus()}
}

function doLogout(){_auth=false;location.reload()}

/* ═══ INIT ═══ */
async function initApp(){
  if(!DB){DB=await openDB()}
  try{
    cats=await dbGetAll('categories');
  rooms=await dbGetAll('rooms');
  locs=await dbGetAll('locations');
  products=await dbGetAll('products');
  recipes=await dbGetAll('recipes');
  shopping=await dbGetAll('shopping');
  if(!cats.length){
    var defaults=[
      {id:'c_obst',name:'Obst',emoji:'🍎',color:'#f44336'},
      {id:'c_gemuese',name:'Gemüse',emoji:'🥕',color:'#8bc34a'},
      {id:'c_nudeln',name:'Nudeln & Getreide',emoji:'🍝',color:'#e74c3c'},
      {id:'c_reis',name:'Reis & Cerealien',emoji:'🍚',color:'#f39c12'},
      {id:'c_konserven',name:'Konserven',emoji:'🥫',color:'#e67e22'},
      {id:'c_oel_essig',name:'Öl & Essig',emoji:'🫒',color:'#2ecc71'},
      {id:'c_saucen',name:'Saucen & Dressing',emoji:'🍶',color:'#3498db'},
      {id:'c_gehwuerze',name:'Gewürze & Kräuter',emoji:'🧂',color:'#9b59b6'},
      {id:'c_meel',name:'Mehl & Backen',emoji:'🌾',color:'#d4a574'},
      {id:'c_suesses',name:'Süßes & Schokolade',emoji:'🍫',color:'#e91e63'},
      {id:'c_getraenke',name:'Getränke',emoji:'🥤',color:'#00bcd4'},
      {id:'c_kuehl',name:'Kühlregal & Milch',emoji:'🧊',color:'#64b5f6'},
      {id:'c_frisch',name:'Frischkost & Brot',emoji:'🥗',color:'#4caf50'},
      {id:'c_fleisch',name:'Fleisch & Wurst',emoji:'🥩',color:'#c0392b'},
      {id:'c_kaes',name:'Käse',emoji:'🧀',color:'#ffc107'},
      {id:'c_tiefkuehl',name:'Tiefkühler',emoji:'❄️',color:'#90caf9'},
      {id:'c_haushalt',name:'Haushaltswaren',emoji:'🧹',color:'#78909c'},
      {id:'c_waschmittel',name:'Waschmittel & Putz',emoji:'🧴',color:'#5c6bc0'},
      {id:'c_hygiene',name:'Dusche & Hygiene',emoji:'🚿',color:'#ec407a'},
      {id:'c_sonstiges',name:'Sonstiges',emoji:'📦',color:'#795548'}
    ];
    for(var i=0;i<defaults.length;i++)await dbPut('categories',defaults[i]);
    cats=defaults;
  }
  go('pantry',document.querySelector('.tab'));
  }catch(e){console.error('initApp error:',e)}
}

/* ═══ TABS ═══ */
async function go(t,btn){
  TAB=t;document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b===btn)});

/* ═══ HELPERS ═══ */
function catEmoji(c){
  if(!cats.length)return'📦';
  var found=cats.find(function(x){return x.name===c});
  return found?found.emoji:'📦';
}
function catColor(c){
  if(!cats.length)return'#888';
  var found=cats.find(function(x){return x.name===c});
  return found?found.color:'#888';
}
function expSt(exp){
  if(!exp)return null;var now=Date.now(),d=Math.ceil((new Date(exp).getTime()-now)/864e5);
  if(d<0)return{l:(Math.abs(d)+'x abgelaufen'),c:'b-exp'};
  if(d<=0)return{l:'Heute!',c:'b-exp'};
  if(d<=3)return{l:'In '+d+'d',c:'b-soon'};
  return{l:exp,c:'b-ok'};
}
function genCode(){
  var chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',code='';
  for(var i=0;i<6;i++)code+=chars[Math.floor(Math.random()*chars.length)];
  return locs.find(function(l){return l.code===code})?genCode():code;
}

/* ═══ PANTRY ═══ */
async function render(){
  products=await dbGetAll('products');locs=await dbGetAll('locations');
  var main=document.getElementById('mainArea');
  if(TAB==='pantry')renderPantry(main);
  else if(TAB==='locations')renderLocs(main);
  else if(TAB==='recipes')renderRecs(main);
  else if(TAB==='weekplan')renderWeek(main);
  else if(TAB==='shopping')renderShop(main);
  else renderSet(main);
}

function renderPantry(main){
  var items=products.slice().sort(function(a,b){return(a.exp?new Date(a.exp):new Date('2999'))-(b.exp?new Date(b.exp):new Date('2999'))});
  var searchEl=document.getElementById('searchInput');
  var search=searchEl?searchEl.value.toLowerCase():'';
  if(search)items=items.filter(function(p){return(p.name||'').toLowerCase().indexOf(search)>=0||(p.barcode||'').indexOf(search)>=0||(p.cat||'').toLowerCase().indexOf(search)>=0});
  if(CF!=='all')items=items.filter(function(p){return p.cat===CF});
  var total=products.length,exp=0,soon=0;
  items.forEach(function(p){if(p.exp){var d=Math.ceil((new Date(p.exp).getTime()-Date.now())/864e5);if(d<0)exp++;else if(d<=7)soon++}});
  var h='<div style="display:flex;gap:8px;margin-bottom:12px">';
  h+='<div class="card" style="flex:1;text-align:center"><div style="font-size:1.2rem;font-weight:700;color:var(--pri)">'+total+'</div><div style="font-size:.6rem;color:var(--sub)">Produkte</div></div>';
  h+='<div class="card" style="flex:1;text-align:center"><div style="font-size:1.2rem;font-weight:700;color:var(--amber)">'+soon+'</div><div style="font-size:.6rem;color:var(--sub)">Bald abgelaufen</div></div>';
  h+='<div class="card" style="flex:1;text-align:center"><div style="font-size:1.2rem;font-weight:700;color:var(--red)">'+exp+'</div><div style="font-size:.6rem;color:var(--sub)">Abgelaufen</div></div></div>';
  h+='<div class="flex" style="margin-bottom:12px"><input type="text" id="searchInput" placeholder="Suchen..." oninput="render()" style="flex:1;margin-top:0">';
  h+='<button class="btn btn-sm btn-s" onclick="scanProd()" style="margin-top:0;white-space:nowrap" title="Barcode">📷</button>';
  h+='<button class="btn btn-sm btn-s" onclick="scanLocCode()" style="margin-top:0;white-space:nowrap" title="Lager-Code">🏷</button></div>';
  var pills='<div class="pills">';
  pills+='<div class="pill '+(CF==='all'?'on':'')+'" onclick="filterCat(\'all\',this)">Alle ('+total+')</div>';
  cats.forEach(function(c){
    var cnt=products.filter(function(p){return p.cat===c.name}).length;
    pills+='<div class="pill '+(CF===c.name?'on':'')+'" onclick="filterCat(\''+c.name+'\',this)" style="border-left:3px solid '+c.color+'">'+c.emoji+' '+esc(c.name)+' ('+cnt+')</div>';
  });
  pills+='</div>';h+=pills;
  if(!items.length)h+='<div class="empty"><div class="ic">🍽️</div><p>Noch keine Produkte.<br>Tippe + zum Hinzufügen.</p></div>';
  else h+=items.map(function(p){
    var loc=locs.find(function(l){return l.id===p.locId});
    var ex=expSt(p.exp),exHtml=ex?'<span class="badge '+ex.c+'">'+ex.l+'</span>':'';
    var locHtml=loc?'<span class="badge b-loc">📍 '+esc(loc.name)+'</span>':'';
    return '<div class="card" onclick="editProd(\''+p.id+'\')"><div class="flex" style="align-items:flex-start"><div style="font-size:1.3rem;flex-shrink:0;margin-right:8px">'+catEmoji(p.cat)+'</div><div style="flex:1"><div style="font-weight:600">'+esc(p.name)+'</div><div style="font-size:.7rem;color:var(--sub)">'+p.qty+' '+esc(p.unit)+(p.pkg?' · '+esc(p.pkg):'')+(locHtml?'<br>'+locHtml:'')+'</div><div style="margin-top:2px">'+exHtml+'</div></div><div class="flex" style="gap:3px"><button onclick="event.stopPropagation();openTimeline(\''+p.id+'\')" class="btn btn-sm btn-s" style="width:28px;height:28px;padding:0;font-size:.7rem" title="Timeline">📈</button><button onclick="event.stopPropagation();editProd(\''+p.id+'\')" class="btn btn-sm btn-s" style="width:28px;height:28px;padding:0;font-size:.7rem">✏️</button><button onclick="event.stopPropagation();delProd(\''+p.id+'\')" class="btn btn-sm btn-s" style="width:28px;height:28px;padding:0;font-size:.7rem;color:var(--red)">🗑</button></div></div></div>';
  }).join('');
  main.innerHTML=h;
}
function filterCat(f,el){CF=f;document.querySelectorAll('.pills .pill').forEach(function(p){p.classList.remove('on')});el.classList.add('on');render()}

  document.getElementById('lookupInfo').classList.add('hidden');
  var opts='<option value="">— Ohne —</option>';
  locs.sort(function(a,b){return a.name.localeCompare(b.name)}).forEach(function(l){opts+='<option value="'+l.id+'">'+esc(l.name)+'</option>'});
  document.getElementById('fPLoc').innerHTML=opts;
  ['fPName','fPBarcode','fPQty','fPPkg','fPNote'].forEach(function(id){document.getElementById(id).value=''});

  cats.forEach(function(c){sel.innerHTML+='<option>'+c.emoji+' '+esc(c.name)+'</option>'});sel.selectedIndex=0;
  document.getElementById('mProdSave').onclick=function(){saveProduct(null)};
  openM('mProd');setTimeout(function(){document.getElementById('fPName').focus()},150);

function editProd(id){
  var p=products.find(function(x){return x.id===id});if(!p)return;
  document.getElementById('mProdTitle').textContent='Produkt bearbeiten';
  document.getElementById('lookupInfo').classList.add('hidden');
  var opts='<option value="">— Ohne —</option>';
  locs.forEach(function(l){opts+='<option value="'+l.id+'">'+esc(l.name)+'</option>'});
  document.getElementById('fPLoc').innerHTML=opts;
  document.getElementById('fPName').value=p.name;document.getElementById('fPBarcode').value=p.barcode||'';
  var sel=document.getElementById('fPCat');sel.innerHTML='';
  cats.forEach(function(c){sel.innerHTML+='<option'+(c.name===p.cat?' selected':'')+'>'+c.emoji+' '+esc(c.name)+'</option>'});
  document.getElementById('fPQty').value=p.qty;document.getElementById('fPUnit').value=p.unit||'g';
  document.getElementById('fPPkg').value=p.pkg||'';document.getElementById('fPExp').value=p.exp||'';
  document.getElementById('fPLoc').value=p.locId||'';
  document.getElementById('fPNote').value=p.note||'';
  document.getElementById('mProdSave').onclick=function(){saveProduct(id)};
  openM('mProd');
}
async function saveProduct(editId){
  var nm=document.getElementById('fPName').value.trim();if(!nm){toast('Name fehlt!');return}
  var brand=document.getElementById('fPName').value.match(/^([A-Z][a-zäöüß]+(?:\s+[A-Z][a-zäöüß]+)*)\s+(.*)/);
  var finalName=nm;
  var autoCat='';
  if(brand){
    finalName=brand[1]+' '+brand[2];
    autoCat=autoCatFromName(brand[1]+' '+brand[2]);
  }
  var obj={name:finalName,barcode:document.getElementById('fPBarcode').value.trim(),cat:document.getElementById('fPCat').value,
    qty:parseInt(document.getElementById('fPQty').value)||0,unit:document.getElementById('fPUnit').value,
    pkg:document.getElementById('fPPkg').value.trim(),exp:document.getElementById('fPExp').value,
    locId:document.getElementById('fPLoc').value||null,note:document.getElementById('fPNote').value.trim()};
  if(editId){var p=products.find(function(x){return x.id===editId});if(!p)return;Object.assign(p,obj);await dbPut('products',p);toast('✅ Aktualisiert')}
  else{obj.id=uid();obj.created=today();products.push(obj);await dbPut('products',obj);toast('✅ Gespeichert')}
  closeM('mProd');render();
}
async function delProd(id){
  var p=products.find(function(x){return x.id===id});if(!p)return;
  showCf('"'+p.name+'" löschen?\nTimeline-Einträge gehen auch verloren.',function(){
    products=products.filter(function(x){return x.id!==id});dbClear('product_timeline').then(function(){render()});toast('🗍');
  });
}

/* ═══ ONLINE LOOKUP ═══ */
async function doOnlineLookup(){
  var code=document.getElementById('fPBarcode').value.trim();
  if(!code){toast('Barcode eingeben!');return}
  var btn=document.querySelector('#mProd [onclick*=doOnline]');btn.textContent='⏳';btn.disabled=true;
  try{
    var r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json',{signal:AbortSignal.timeout(5000)});
    var j=await r.json();
    if(j.status===1&&j.product){
    var p=j.product,cat=mapCat(p.categories_tags||[]),pkg=extPkg(p.quantity||'');
    document.getElementById('lookupInfo').classList.remove('hidden');
    document.getElementById('lookupInfo').innerHTML='✅ <b>'+esc(p.product_name||'Unbekannt')+'</b>'+\
      (p.brands?' · '+esc(p.brands):'')+(pkg?' · '+esc(pkg):'')+(p.countries?'<br>🌍 '+esc(p.countries):'');
    if(!document.getElementById('fPName').value)document.getElementById('fPName').value=p.product_name||'';
    if(!document.getElementById('fPPkg').value&&pkg)document.getElementById('fPPkg').value=pkg;
    var autoC=autoCatFromName(p.product_name||'');
    if(autoC!=='Sonstiges'){
      document.getElementById('autoCatText').textContent=autoC+' — '+(p.brands?'✅ Marke: '+esc(p.brands):'📦 Kategorie');
      document.getElementById('autoCatDiv').style.display='block';
    }
    var sel=document.getElementById('fPCat');
    for(var i=0;i<sel.options.length;i++){if(sel.options[i].textContent.includes(autoC)){sel.selectedIndex=i;break}}
    toast('✅ Produkt gefunden!');
    } else {document.getElementById('lookupInfo').classList.remove('hidden');document.getElementById('lookupInfo').innerHTML='<span style="color:var(--red)">❌ Nicht gefunden</span>';toast('Nicht in DB')}
  }catch(e){toast('❌ '+e.message)}
  btn.textContent='🔍';btn.disabled=false;
}
function mapCat(tags){var t=(tags||[]).join(',').toLowerCase();if(/noodle|pasta/.test(t))return'Nudeln & Getreide';if(/rice/.test(t))return'Reis & Cerealien';if(/canned/.test(t))return'Konserven';if(/oil/.test(t))return'Öl & Essig';if(/sauce/.test(t))return'Saucen & Dressing';if(/flour|grain/.test(t))return'Mehl & Backen';if(/sweet|chocolate/.test(t))return'Süßes & Schokolade';if(/drink|juice/.test(t))return'Getränke';if(/dairy/.test(t))return'Kühlregal & Milch';if(/fruit/.test(t))return'Obst';if(/vegetable/.test(t))return'Gemüse';if(/meat/.test(t))return'Fleisch & Wurst';if(/cheese/.test(t))return'Käse';return'Sonstiges'}
function autoCatFromName(name){var n=name.toLowerCase();if(/nutella|schoko|nuss.*creme/.test(n))return'Kühlregal & Milch';if(/wasch|putz|reinig|spuel|kochen/.test(n))return'Waschmittel & Putz';if(/toilet|dusch|shampo|bodywash|handseif/.test(n))return'Dusche & Hygiene';if(/haushalts|tüch|roll|alumi/.test(n))return'Haushaltswaren';if(/ketchup|senf|mayi|sojasauce|dressin/.test(n))return'Saucen & Dressing';if(/nudel|spaghetti|penne|fusilli|macar/.test(n))return'Nudeln & Getreide';if(/reis|basmati|parboil/.test(n))return'Reis & Cerealien';if(/milch|joghurt|quark|saure.rahm|butter/.test(n))return'Kühlregal & Milch';if(/kaes|gouda|camembert|edamer/.test(n))return'Käse';if(/fleisch|wurst|brueste|huehner/.test(n))return'Fleisch & Wurst';if(/obst|apfel|banane|orange/.test(n))return'Obst';if(/gemuese|karotte|tomate|gurke/.test(n))return'Gemuese';if(/kaffee|tee|waser|cola|fanta/.test(n))return'Getränke';if(/kuchen|keks|schokolade|mars|snick/.test(n))return'Süßes & Schokolade';if(/gewuerz|pfeffer|salz|oregano|basion/.test(n))return'Gewürze & Kräuter';if(/oel|oliven|raps|sonnen/.test(n))return'Öl & Essig';if(/essig|balsam|apple cider/.test(n))return'Öl & Essig';if(/kuehl|tiefkuehl|pizza.*tief/.test(n))return'Tiefkühler';if(/konserven|dose/.test(n))return'Konserven';return'Sonstiges'}
function extPkg(q){if(!q)return'';var m=q.match(/^(\d+)[\.,\s]*(g|kg|ml|l|cl)?$/i);return m?(m[1].replace(',','.')+(m[2]?m[2].toLowerCase():'')):q}

/* ═══ TIMELINE ═══ */
async function openTimeline(prodId){
  curTimelineProd=prodId;var p=products.find(function(x){return x.id===prodId});if(!p)return;
  document.getElementById('tlTitle').textContent='📈 '+p.name;
  var tl=await dbGetAll('product_timeline');
  var items=tl.filter(function(t){return t.prodId===prodId}).sort(function(a,b){return new Date(b.ts)-new Date(a.ts)});
  var h=items.length?'<div class="time-line">':'';
  if(items.length)h+=items.map(function(t){
    var typeLabels={used:'🍽 Verbraucht',bought:'🛒 Gekauft',expedited:'⏩ Vorverlegt',expired:'🗑 Abgelaufen',created:'📦 Erstellt'};
    h+='<div class="tl-item '+t.type+'"><div class="tl-date">'+timeStr(t.ts)+'</div><div class="tl-text">'+typeLabels[t.type]||t.type;
    if(t.amount)h+=' · '+t.amount;
    if(t.note)h+=' — '+esc(t.note);
    h+='</div></div>';
  }).join('')+'</div>';
  else h='<div class="empty" style="padding:20px"><p>Noch keine Einträge.</p></div>';
  document.getElementById('timelineContent').innerHTML=h;
  openM('timelineModal');
}
async function addTimelineEntry(type){
  var amount=prompt('Menge (optional):','');
  var note=prompt('Bemerkung (optional):','');
  await dbPut('product_timeline',{id:uid(),prodId:curTimelineProd,type:type,amount:amount?parseInt(amount):null,note:note||'',ts:new Date().toISOString()});
  openTimeline(curTimelineProd);toast('✅ '+type);
}

/* ═══ LOCATIONS ═══ */
async function renderLocs(main){
  rooms=await dbGetAll('rooms');locs=await dbGetAll('locations');products=await dbGetAll('products');
  if(!locs.length){main.innerHTML='<div class="empty"><div class="ic">🗄️</div><p>Keine Lagerplätze.<br>Tippe + zum Hinzufügen.</p></div>';return}
  var groups={};locs.forEach(function(l){var r=rooms.find(function(rom){return rom.id===l.roomId})||{name:'Sonstiges'};if(!groups[r.name])groups[r.name]=[];groups[r.name].push(l)});
  var h='<div class="flex" style="margin-bottom:12px"><input type="text" placeholder="Suchen..." oninput="render()" style="flex:1;margin-top:0"><button onclick="scanLocCode()" class="btn btn-sm btn-s" style="margin-top:0">🏷</button></div>';
  Object.keys(groups).sort().forEach(function(room){
    h+='<div style="font-size:.7rem;color:var(--sub);text-transform:uppercase;margin:12px 0 8px">📁 '+esc(room)+'</div>';
    groups[room].forEach(function(l){
      var cnt=products.filter(function(p){return p.locId===l.id}).length;
      h+='<div class="card"><div class="flex" style="align-items:flex-start"><div style="flex:1"><div style="font-weight:600">'+esc(l.name)+'</div><div style="font-size:.7rem;color:var(--sub)">'+cnt+' Produkt'+(cnt!==1?'e':'')+' · Code: <span class="badge b-loc">'+esc(l.code)+'</span>'+(l.shelf?' · Regal '+esc(l.shelf):'')+(l.compartment?' · Fach '+esc(l.compartment):'')+'</div></div><div class="flex" style="gap:3px"><button onclick="showQR(\''+l.id+'\')" class="btn btn-sm btn-s" style="width:28px;height:28px;padding:0;font-size:.7rem" title="QR">📱</button><button onclick="viewLocById(\''+l.id+'\')" class="btn btn-sm btn-s" style="width:28px;height:28px;padding:0;font-size:.7rem" title="Inhalte">👁</button><button onclick="assignLoc(\''+l.id+'\')" class="btn btn-sm btn-s" style="width:28px;height:28px;padding:0;font-size:.7rem" title="Zuweisen">➕</button><button onclick="delLoc(\''+l.id+'\')" class="btn btn-sm btn-s" style="width:28px;height:28px;padding:0;font-size:.7rem;color:var(--red)">🗑</button></div></div></div>';
    });
  });main.innerHTML=h;
}

  w.document.close();setTimeout(function(){w.print()},500);

function viewLoc(loc){
  if(!loc)return;document.getElementById('locViewTitle').textContent='📍 '+loc.name;
  var prods=products.filter(function(p){return p.locId===loc.id});
  if(!prods.length)document.getElementById('locViewContent').innerHTML='<div style="text-align:center;padding:20px;color:var(--sub)">Keine Produkte.</div>';
  else document.getElementById('locViewContent').innerHTML=prods.map(function(p){

/* ═══ SCANNER ═══ */
var html5qr=null,scannerOn=false,currentFacing='environment';

/** Show the camera overlay — gives the browser time to paint */
function showScannerOverlay(cbOk){
  scannerOn = true;
  var wrap = document.getElementById('scanWrap');
  var reticle = document.getElementById('scanReticle');
  wrap.classList.add('on');
  wrap.style.display = 'flex';
  if(reticle) reticle.style.display = 'block';

  // Wait for overlay to be fully painted before starting camera
  setTimeout(function(){
    try{
      html5qr = new Html5Qrcode('scanReader', false);
      html5qr.start(
        { facingMode: currentFacing },
        {
          fps: 10,
          qrbox: { width: 250, height: 250 },
          cameraDisplayWidth: 480,
          cameraDisplayHeight: 480
        },
        function(decodedText){
          if(!scannerOn) return;
          scannerOn = false;
          hideScannerOverlay();
          cbOk(decodedText);
        },
        function(errorMessage){
          // Scan failure callback — called continuously, IGNORE
        }
      ).catch(function(err){
        scannerError(err);
      });
      // Show toggle button after camera starts
      setTimeout(function(){
        var btn = document.getElementById('scanBtn');
        if(btn) btn.style.display = 'inline-flex';
      }, 600);
    } catch(e){ scannerError(e); }
  }, 150);
}

/** Hide overlay and stop camera cleanly */
function hideScannerOverlay(){
  scannerOn = false;
  if(html5qr){
    html5qr.stop().then(function(){
      html5qr.clear();
      html5qr = null;
    }).catch(function(){});
  }
  document.getElementById('scanWrap').classList.remove('on');
  document.getElementById('scanWrap').style.display = 'none';
  var btn = document.getElementById('scanBtn');
  if(btn) btn.style.display = 'none';
  var ret = document.getElementById('scanReticle');
  if(ret) ret.style.display = 'none';
}

/** Human-readable error → toast + close overlay */
function scannerError(err){
  scannerOn = false;
  var msg = 'Kamera-Fehler';
  if(err && err.message){
    var m = err.message.toLowerCase();
    if(m.indexOf('permission')>=0 || m.indexOf('denied')>=0){
      msg = 'Kamera-Zugriff verweigert. Bitte erlaube den Zugriff in den Safari-Einstellungen.';
    } else if(m.indexOf('notfound')>=0 || m.indexOf('not found')>=0){
      msg = 'Keine Kamera auf diesem Gerät gefunden.';
    } else if(m.indexOf('inactive')>=0 || m.indexOf('notstarted')>=0){
      msg = 'Kamera konnte nicht gestartet werden.';
    } else {
      msg = 'Kamera: '+err.message;
    }
  }
  toast(msg);
  hideScannerOverlay();
}

/** Switch front/back camera — uses global state, not library internals */
function toggleCamera(){
  if(!html5qr || !scannerOn) { toast('Kamera nicht aktiv'); return; }
  currentFacing = (currentFacing === 'environment') ? 'user' : 'environment';
  toast('📷 Wechsle Kamera...');

  html5qr.stop().then(function(){
    return html5qr.start(
      { facingMode: currentFacing },
      {
        fps: 10,
        qrbox: { width: 250, height: 250 },
        cameraDisplayWidth: 480,
        cameraDisplayHeight: 480
      },
      function(decodedText){
        if(!scannerOn) return;
        scannerOn = false;
        hideScannerOverlay();
        handleScan(decodedText);
      },
      function(){ /* ignore scan errors */ }
    );
  }).catch(function(err){
    scannerError(err);
  });
}

/** Cancel scanning and close overlay */
function cancelScan(){
  scannerOn = false;
  pendingLoc = null;
  hideScannerOverlay();
  toast('Scanner abgebrochen');
}

/* === SCANNER: handleScan — barcode text → local DB + OpenFoodFacts === */
async function handleScan(code){
  /* 1. Check local IndexedDB first */
  var local = products.find(function(p){ return p.barcode === code; });
  if(local){
    if(confirm('"'+local.name+'" vorhanden. +1?\nAktuell: '+local.qty+' '+local.unit)){
      local.qty+=1;await dbPut('products',local);render();toast('✅ '+local.name+' +1');
      await dbPut('product_timeline',{id:uid(),prodId:local.id,type:'used',amount:-1,note:'+1 durch Scan',ts:new Date().toISOString()});
    }
    return;
  }

  /* 2. Look up OpenFoodFacts */
  toast('🔍 Suche Produkt...');
  try{
    var r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json',{signal:AbortSignal.timeout(8000)});
    var j=await r.json();
    if(j.status===1&&j.product){
      var p=j.product;
      var name=p.product_name||'';
      var brand=p.brands||'';
      var pkg=p.quantity||'';
      var cat=mapCat(p.categories_tags||[]);

      // If modal already open: fill it in place
      if(document.getElementById('mProd').classList.contains('on')){
        document.getElementById('fPBarcode').value=code;
        if(name)document.getElementById('fPName').value=name;
        if(pkg)document.getElementById('fPPkg').value=extPkg(pkg)||pkg;
        var autoC=autoCatFromName(name||'');
        if(autoC!=='Sonstiges')document.getElementById('autoCatText').textContent=autoC+' — '+(brand?'✅ Marke: '+esc(brand):'📦 Kategorie');
        var sel=document.getElementById('fPCat');
        for(var i=0;i<sel.options.length;i++){
          if(sel.options[i].textContent.includes(autoC)){sel.selectedIndex=i;break}
        }
        document.getElementById('autoCatDiv').style.display='block';
        document.getElementById('lookupInfo').classList.remove('hidden');
        document.getElementById('lookupInfo').innerHTML=
          '✅ <b>'+esc(name||'Unbekannt')+'</b>'+
          (brand?'<br>🏭 '+esc(brand):'')+
          (pkg?'<br>📦 '+esc(extPkg(pkg)||pkg):'')+
          (p.countries?'<br>🌍 '+esc(p.countries):'');
        toast('✅ Produkt gefunden!');
      } else {
        // Open modal with data
        document.getElementById('fPBarcode').value=code;
        document.getElementById('fPName').value=name||'';
        if(pkg)document.getElementById('fPPkg').value=extPkg(pkg)||pkg;
        var autoC=autoCatFromName(name||'');
        if(autoC!=='Sonstiges'){
          document.getElementById('autoCatText').textContent=autoC+' — '+(brand?'✅ Marke: '+esc(brand):'📦 Kategorie');
          document.getElementById('autoCatDiv').style.display='block';
        }
        var sel=document.getElementById('fPCat');
        for(var i=0;i<sel.options.length;i++){if(sel.options[i].textContent.includes(autoC)){sel.selectedIndex=i;break}}
        openM('mProd');
        toast('✅ Produkt gefunden!');
      }
    } else {
      // Not found in API — still fill barcode
      document.getElementById('fPBarcode').value=code;
      if(document.getElementById('mProd').classList.contains('on')){
        document.getElementById('lookupInfo').classList.remove('hidden');
        document.getElementById('lookupInfo').innerHTML='<span style="color:var(--red)">❌ Nicht in OpenFoodFacts</span><br><span style="color:var(--sub)">Bitte manuell erfassen.</span>';
      } else {
        openM('mProd');
      }
    }
  }catch(e){
    document.getElementById('fPBarcode').value=code;
    if(document.getElementById('mProd').classList.contains('on')){
      document.getElementById('lookupInfo').classList.remove('hidden');
      document.getElementById('lookupInfo').innerHTML='<span style="color:var(--red)">❌ Netzfehler</span><br><span style="color:var(--sub)">Bitte manuell erfassen.</span>';
    } else {
      openM('mProd');
    }
    toast('❌ '+e.message);
  }
}

/* ═══ RECIPE IMPORT ═══ */
async function importRecipe(){
  var url=document.getElementById('fRImportUrl').value.trim();
  if(!url){toast('URL eingeben!');return}
  var status=document.getElementById('rImportStatus');status.textContent='🔍 Lade...';
  try{
    var proxyUrl='https://api.allorigins.win/raw?url='+encodeURIComponent(url);
    var r=await fetch(proxyUrl,{signal:AbortSignal.timeout(8000)});
    var html=await r.text();status.textContent='📄 '+html.length+' Bytes...';
    var jsonLd=extractJsonLd(html);
    if(jsonLd){
      var recipe=parseRecipe(jsonLd,url);
      if(recipe.name){
        importedRecipe=recipe;
        status.textContent='✅ '+recipe.name;
        document.getElementById('rImportSave').classList.remove('hidden');
        document.getElementById('fRName').value=recipe.name;
        document.getElementById('fRUrl').value=url;
        document.getElementById('fRTime').value=recipe.time||'';
        document.getElementById('fRCal').value=recipe.cal||'';
        document.getElementById('fRDiff').value=recipe.diff||'Einfach';
        document.getElementById('fRTy').value=recipe.type||'Mittagessen';
        recipeIngrs=recipe.ingredients||[];renderRecipeIngrs();
      } else {status.textContent='❌ Kein Rezept-JSON-LD';document.getElementById('rImportSave').classList.add('hidden')}
    } else {status.textContent='⚠️ Kein JSON-LD. Manuelles Erfassen:';document.getElementById('rImportSave').classList.remove('hidden');importedRecipe={name:'',url:url,ingredients:[]}}
  }catch(e){status.textContent='❌ '+e.message+'. Manuelles Erfassen:';document.getElementById('rImportSave').classList.remove('hidden');importedRecipe={name:'',url:url,ingredients:[]}}
}
function extractJsonLd(html){
  var scripts=html.match(/<script[^>]*type="application\/ld\+json"[^>]*>(.*?)<\/script>/gi);
  if(!scripts)return null;
  for(var i=0;i<scripts.length;i++){
    try{
      var jsonStr=scripts[i].replace(/<script[^>]*>/i,'').replace(/<\/script>/i,'');
      var data=JSON.parse(jsonStr);
      if(data['@type']==='Recipe'||(data['@graph']&&data['@graph'].some(function(g){return g['@type']==='Recipe'})))return data;
      if(data['@graph']){var recipe=data['@graph'].find(function(g){return g['@type']==='Recipe'});if(recipe)return recipe}
    }catch(e){}
  }return null;
}
function parseRecipe(data,url){
  return{name:data.name||data.headline||'',time:data.prepTime||data.cookTime||data.totalTime||'',
    cal:data.calories||'',diff:data.recipeCategory||'Einfach',type:data.recipeCategory||'Mittagessen',
    ingredients:(data.recipeIngredient||[]).map(function(ing){return{name:ing.trim(),amount:'',unit:''}}),
    instructions:data.recipeInstructions||'',url:url};
}
function saveImportedRecipe(){
  if(importedRecipe){importedRecipe.id=uid();importedRecipe.created=today();
    dbPut('recipes',importedRecipe).then(function(){recipes.push(importedRecipe);closeM('mRImport');closeM('mRecipe');render();toast('✅ Importiert')});
  }
}

async function genWeek(){
  var avail=new Set(products.map(function(p){return p.name.toLowerCase()}));
  recipes=await dbGetAll('recipes');
  var scored=recipes.map(function(r){var sc=0;if(r.ingredients)r.ingredients.forEach(function(ing){avail.forEach(function(a){if(a.indexOf(ing.name.toLowerCase())>=0||ing.name.toLowerCase().indexOf(a)>=0)sc++})});return Object.assign({},r,{sc:sc})}).sort(function(a,b){return b.sc-a.sc});
  var days=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
  var types=['Frühstück','Mittagessen','Abendessen'];
  var plans=days.map(function(day,di){
    return {id:uid(),day:day,recipes:types.map(function(type,ti){
      var matches=scored.filter(function(r){return r.type===type});
      return matches.length?Object.assign({},matches[(di+ti)%matches.length]):scored[di%scored.length]||null;
    }).filter(Boolean)};
  });
  await dbPut('weekly_plans',{id:'current_week',plans:plans,weekStart:today()});

}

async function moveInv(i){
  var item=shopping[i];if(!item)return;
  var ex=products.find(function(p){return p.name.toLowerCase()===item.name.toLowerCase()});
  if(ex){ex.qty+=item.qty;await dbPut('products',ex);toast('✅ '+item.name)}
  else{var np={id:uid(),name:item.name,barcode:'',cat:item.cat||'Sonstiges',qty:item.qty,unit:item.unit,pkg:'',exp:'',locId:null,note:'',created:today()};products.push(np);await dbPut('products',np);toast('✅ '+item.name+' angelegt')}
  shopping.splice(i,1);render();
}

/* ═══ SETTINGS ═══ */
function renderSet(main){
  main.innerHTML='<div style="font-size:.7rem;color:var(--sub);text-transform:uppercase;margin:8px 0">📤 Backup</div>'+
    '<button onclick="exportDB()" class="btn btn-p" style="width:100%;padding:13px;margin-bottom:14px">📥 JSON herunterladen</button>'+
    '<div style="font-size:.7rem;color:var(--sub);text-transform:uppercase;margin:8px 0">📥 Import</div>'+
    '<input type="file" accept=".json" onchange="importDB(event)" style="margin-bottom:16px">'+
    '<div style="font-size:.7rem;color:var(--sub);text-transform:uppercase;margin:8px 0">🗑️ Alles löschen</div>'+
    '<button onclick="clearDB()" class="btn btn-r" style="width:100%;padding:13px">Unwiderruflich löschen</button>';
}
async function exportDB(){
  var data={};var stores=['categories','rooms','locations','products','recipe_ingredients','shopping','weekly_meals','weekly_plans','product_timeline'];
  for(var i=0;i<stores.length;i++)data[stores[i]]=await dbGetAll(stores[i]);
  var b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download='kuechen-vorrat-'+today()+'.json';a.click();URL.revokeObjectURL(u);toast('📤');
}
async function importDB(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(ev){try{var d=JSON.parse(ev.target.result);
    Object.keys(d).forEach(function(store){dbClear(store).then(function(){d[store].forEach(function(obj){dbPut(store,obj)})})});
    toast('📥 Importiert!');render();
  }catch(err){toast('❌ '+err.message)}};r.readAsText(f);e.target.value='';
}
async function clearDB(){showCf('ALLE Daten unwiderruflich löschen?',function(){
  var stores=['categories','rooms','locations','products','recipe_ingredients','shopping','weekly_meals','weekly_plans','product_timeline'];
  stores.forEach(function(s){dbClear(s)});render();toast('🗍');
});}

/* ═══ INIT ═══ */
document.addEventListener('DOMContentLoaded',function(){
  // Setup login listener safely (DOM is ready)
  var pwInput=document.getElementById('pw');
  if(pwInput) pwInput.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();doLogin()}
  });

  // Open DB in background (non-blocking)
  var dbInitDone=false;
  openDB().then(function(){
    dbInitDone=true;
  }).catch(function(e){
    console.warn('IndexedDB konnte nicht geöffnet werden:',e);
  });

  // Expose for inline onclick handlers
  window._dbReady=function(){return dbInitDone};
});
</script>
