<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Vorrat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f0f1a;--card:#1a1a2e;--pri:#6c63ff;--txt:#e0e0e0;--sub:#888;--red:#e74c3c;--green:#27ae60;--pad:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;min-height:100dvh}

/* Login */
.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;padding:24px}
.login.hidden{display:none}
.login-card{background:var(--card);border-radius:16px;padding:28px 24px;width:100%;max-width:300px;text-align:center}
.login-card h1{font-size:1.3rem;margin-bottom:6px}
.login-card .sub{color:var(--sub);font-size:.8rem;margin-bottom:20px}
.login-card input{width:100%;padding:14px;background:var(--bg);border:1px solid #333;border-radius:10px;color:#fff;font-size:1rem;text-align:center;outline:none;-webkit-appearance:none}
.login-card input:focus{border-color:var(--pri)}
.login-card button{width:100%;padding:14px;background:var(--pri);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:10px;-webkit-appearance:none}
.login-card button:active{background:#5a52e0;transform:scale(.97)}
.err{color:var(--red);font-size:.8rem;margin-top:10px;min-height:18px}

/* App Layout */
.app{display:none;flex-direction:column;height:100vh;height:100dvh}
.app.show{display:flex}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:#16213e;border-bottom:1px solid #2a2a4a;flex-shrink:0}
header h1{font-size:1.1rem;color:var(--pri)}
header button{background:none;border:1px solid #333;color:var(--sub);padding:6px 12px;border-radius:8px;font-size:.75rem;cursor:pointer}
main{flex:1;overflow-y:auto;padding:var(--pad);padding-bottom:84px}

/* Product List */
.pcard{background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.pcard .info{flex:1;min-width:0}
.pcard .name{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .meta{font-size:.78rem;color:var(--sub);margin-top:2px}
.pcard .act{display:flex;gap:4px}
.pcard .act button{background:none;border:1px solid #333;color:var(--sub);width:36px;height:36px;border-radius:8px;font-size:.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pcard .act button:active{background:#333}
.pcard .act button.del{color:var(--red);border-color:var(--red)}

/* Empty */
.empty{text-align:center;padding:80px 20px}
.empty .icon{font-size:3rem;margin-bottom:10px}
.empty p{color:#444;font-size:.9rem}

/* FAB */
.fab{position:fixed;bottom:24px;right:20px;width:54px;height:54px;border-radius:50%;background:var(--pri);color:#fff;border:none;font-size:1.6rem;font-weight:300;cursor:pointer;box-shadow:0 4px 18px rgba(108,99,255,.35);display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.9)}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:100}
.modal.on{display:flex;align-items:flex-end}
.modal-body{background:var(--card);border-radius:16px 16px 0 0;width:100%;padding:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom));max-width:500px;margin:0 auto}
.modal-body h2{font-size:1rem;margin-bottom:18px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:.7rem;color:var(--sub);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg select{width:100%;padding:12px;background:var(--bg);border:1px solid #333;border-radius:10px;color:#fff;font-size:.95rem;outline:none;-webkit-appearance:none}
.fg input:focus,.fg select:focus{border-color:var(--pri)}
.fg select option{background:var(--bg)}
.mbtns{display:flex;gap:10px;margin-top:18px}
.mbtns button{flex:1;padding:13px;border:none;border-radius:10px;font-size:.9rem;font-weight:600;cursor:pointer;-webkit-appearance:none}
.mbtns .cancel{background:#333;color:#ccc}
.mbtns .cancel:active{background:#444}
.mbtns .save{background:var(--pri);color:#fff}
.mbtns .save:active{background:#5a52e0}

/* Category pills */
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;margin-bottom:12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;padding:6px 14px;border-radius:20px;background:#16213e;color:var(--sub);font-size:.78rem;border:1px solid #333;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--pri);color:#fff;border-color:var(--pri)}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="loginScreen">
  <div class="login-card">
    <h1>🍽️ Vorrat</h1>
    <div class="sub">Küchenlager-Verwaltung</div>
    <input type="password" id="pw" placeholder="Passwort" inputmode="text" autocomplete="off" autofocus>
    <button onclick="go()">Einloggen</button>
    <div class="err" id="err"></div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <header>
    <h1>🍽️ <span id="hdrTitle">Vorrat</span></h1>
    <button onclick="logout()">Ausloggen</button>
  </header>
  <main>
    <div class="pills" id="pills"></div>
    <div id="list"></div>
  </main>
  <button class="fab" onclick="openAdd()">+</button>
</div>

<!-- ADD MODAL -->
<div class="modal" id="modal">
  <div class="modal-body">
    <h2>Produkt hinzufügen</h2>
    <div class="fg"><label>Name *</label><input type="text" id="fName" placeholder="z.B. Nudeln" inputmode="text"></div>
    <div class="fg"><label>Menge *</label><input type="number" id="fQty" placeholder="z.B. 3" inputmode="numeric" min="0"></div>
    <div class="fg"><label>Einheit</label>
      <select id="fUnit">
        <option value="Stk">Stück</option>
        <option value="g">g</option>
        <option value="kg">kg</option>
        <option value="ml">ml</option>
        <option value="l">l</option>
      </select>
    </div>
    <div class="fg"><label>Gebindegröße</label><input type="text" id="fPkg" placeholder="z.B. 500ml" inputmode="text"></div>
    <div class="fg"><label>Verfallsdatum</label><input type="date" id="fExp"></div>
    <div class="mbtns">
      <button class="cancel" onclick="closeModal()">Abbrechen</button>
      <button class="save" onclick="save()">Speichern</button>
    </div>
  </div>
</div>

<script>
const PW='kueche2024';
let auth=false;
let data=JSON.parse(localStorage.getItem('kv_d')||'[]');
let filter='all';

// ── Login ──
function go(){
  const el=document.getElementById('pw'),er=document.getElementById('err');
  if(el.value===PW){
    auth=true;el.value='';er.textContent='';
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('app').classList.add('show');
    render();
  } else {
    er.textContent='Falsches Passwort';el.value='';el.focus();
  }
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});

function logout(){auth=false;location.reload();}

// ── Render ──
function render(){
  const cats=[...new Set(data.map(p=>p.cat))].sort();
  let pills='<div class="pill on" data-f="all" onclick="setFilter(this)">Alle ('+data.length+')</div>';
  cats.forEach(c=>{
    const n=data.filter(p=>p.cat===c).length;
    pills+='<div class="pill" data-f="'+c+'" onclick="setFilter(this)">'+c+' ('+n+')</div>';
  });
  document.getElementById('pills').innerHTML=pills;

  let items=filter==='all'?data:data.filter(p=>p.cat===filter);
  // Show expired first
  const now=Date.now();
  items.sort((a,b)=>{
    const ea=a.exp?(new Date(a.exp).getTime()-now):Infinity;
    const eb=b.exp?(new Date(b.exp).getTime()-now):Infinity;
    return ea-eb;
  });

  if(!items.length){
    document.getElementById('list').innerHTML='<div class="empty"><div class="icon">🗄️</div><p>'+(filter==='all'?'Noch keine Produkte.<br>Tippe + zum Hinzufügen.':'Keine Produkte in dieser Kategorie.')+'</p></div>';
    return;
  }
  document.getElementById('list').innerHTML=items.map((p,i)=>{
    let exp='';
    if(p.exp){
      const diff=Math.ceil((new Date(p.exp).getTime()-now)/864e5);
      if(diff<0) exp='<span style="color:var(--red)">· '+Math.abs(diff)+'x abgelaufen</span>';
      else if(diff<=3) exp='<span style="color:#f39c12">· In '+diff+'d abgelaufen</span>';
      else exp='<span style="color:#444">· '+p.exp+'</span>';
    }
    return '<div class="pcard"><div class="info"><div class="name">'+esc(p.n)+'</div><div class="meta">'+p.q+' '+esc(p.u)+(p.pk?' · '+esc(p.pk):'')+exp+'</div></div><div class="act"><button class="del" onclick="del('+data.indexOf(p)+')">🗑</button></div></div>';
  }).join('');
}

function setFilter(el){
  filter=el.dataset.f;
  document.querySelectorAll('.pill').forEach(e=>e.classList.remove('on'));
  el.classList.add('on');
  render();
}

// ── CRUD ──
function openAdd(){
  document.getElementById('fName').value='';
  document.getElementById('fQty').value='';
  document.getElementById('fPkg').value='';
  document.getElementById('fExp').value='';
  document.getElementById('modal').classList.add('on');
  setTimeout(()=>document.getElementById('fName').focus(),150);
}

function closeModal(){
  document.getElementById('modal').classList.remove('on');
}

function save(){
  const n=document.getElementById('fName').value.trim();
  if(!n){show('Name fehlt!');return;}
  const q=parseFloat(document.getElementById('fQty').value)||0;
  const u=document.getElementById('fUnit').value;
  const pk=document.getElementById('fPkg').value.trim();
  const exp=document.getElementById('fExp').value;
  const cat=prompt('Kategorie? (z.B. Nudeln, Gewürze, Getränke)');
  if(!cat||!cat.trim()){show('Kategorie nötig!');return;}
  data.push({n:cat.trim(),q:q,u:u,pk:pk,exp:exp,cat:cat.trim().toLowerCase(),t:Date.now()});
  localStorage.setItem('kv_d',JSON.stringify(data));
  closeModal();render();show('✅ Gespeichert');
}

function del(i){
  const p=data[i];
  if(p&&confirm('"'+p.n+'" löschen?')){
    data.splice(i,1);
    localStorage.setItem('kv_d',JSON.stringify(data));
    render();
  }
}

function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function show(m){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a1a2e;border:1px solid #333;padding:10px 20px;border-radius:10px;font-size:.85rem;color:#fff;z-index:200;transition:opacity .3s';
  t.textContent=m;document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300);},1800);
}
</script>
</body>
</html>
